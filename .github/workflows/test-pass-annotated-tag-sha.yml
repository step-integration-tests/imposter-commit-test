name: Test Pass - Annotated Tag Object SHA
on:
 workflow_dispatch:

permissions:
 contents: read

jobs:
 annotated-tag-sha-test:
   runs-on: ubuntu-latest
   steps:
     - name: Harden Runner
       uses: step-security/harden-runner@int
       with:
         disable-sudo: true
         egress-policy: audit
     - name: Checkout
       uses: actions/checkout@v4

     - name: Use action with annotated tag                                         
       uses: anthropics/claude-code-action@04013efc36bdb40525300b4723bac558c82ec7a9
       continue-on-error: true 
